name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: pip install ruff==0.17.5 mypy==1.19.1
      - name: Lint
        run: |
          ruff check scripts tests
          mypy --ignore-missing-imports scripts/*.py tests/*.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
